services:
  redis:
    image: redis:7-alpine
    container_name: circle_lab_redis
    ports:
      - "6379:6379"
    restart: always

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: circle_lab_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
      - SECRET_KEY=django-insecure-)17_)lk_1b=8qs&sjznxn929(i9&rd7!1j59tv^uh7y^7gfba^
      - DEBUG=1
    depends_on:
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: circle_lab_celery
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
      - SECRET_KEY=django-insecure-)17_)lk_1b=8qs&sjznxn929(i9&rd7!1j59tv^uh7y^7gfba^
      - DEBUG=1
    depends_on:
      - redis
      - web
