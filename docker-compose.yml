services:
  redis:
    image: redis:7-alpine
    container_name: circle_lab_redis
    ports:
      - "6379:6379"
    restart: always

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: circle_lab_web
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
      - SECRET_KEY=9cU^s*(HJVjhuLr4sHtz_iyy2PK9gsaQ@tPFvVzC@3CyPGPdYP
      - DEBUG=1
    depends_on:
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: circle_lab_celery
    command: celery -A core worker -l info
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
      - SECRET_KEY=9cU^s*(HJVjhuLr4sHtz_iyy2PK9gsaQ@tPFvVzC@3CyPGPdYP
      - DEBUG=1
    depends_on:
      - redis
      - web
